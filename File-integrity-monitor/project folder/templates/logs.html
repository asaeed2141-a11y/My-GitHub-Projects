<!DOCTYPE html>
<html>
<head>
    <title>Security Logs</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🔐 Security Logs</h1>

    <p class="subtitle">
        Recorded file integrity events
    </p>


    <div class="card">

        {% if logs %}

            <pre class="log-box">{{ logs }}</pre>

        {% else %}

            <p>No security events have been recorded yet.</p>

        {% endif %}

    </div>


    <div class="card">

        <h2>🗑️ Clear Security Logs</h2>

        <p>
            Remove all recorded integrity events.
        </p>

        <form method="POST" action="/clear-logs" onsubmit="return confirm('Are you sure you want to clear all security logs?');"></form>

            <button type="submit" class="danger-button">
                Clear Logs
            </button>

        </form>

    </div>


    <a href="/">
        <button>← Back to Dashboard</button>
    </a>

</div>

</body>
</html>
